# GitHub Actions CI/CD for Atlas Capture
# Operation Phoenix Atlas — Sprint 10+
#
# Runs on every push to main and on PRs.
# Test matrix: Python 3.11 on ubuntu-latest.

name: Atlas CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test Suite (122+ tests)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pydantic python-dotenv pyyaml requests
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run full test suite
      env:
        GEMINI_API_KEY: "ci_test_placeholder_key_1234567890"
        GOOGLE_CLOUD_PROJECT: "ci-test-project"
      run: |
        python -m pytest tests/ -v --tb=short -x

    - name: Check for secrets in code
      run: |
        if git ls-files | grep -E '^\\.env$'; then
          echo "ERROR: .env file found in repo!"
          exit 1
        fi
        echo "✅ No .env secrets found in tracked files"

  lint:
    name: Syntax Check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Check key module syntax
      run: |
        python -m py_compile data/atlas/infra/config.py
        python -m py_compile data/atlas/infra/selector_health.py
        python -m py_compile data/atlas/domain/models.py
        python -m py_compile data/atlas/infra/resilience.py
        python -m py_compile data/atlas/shared/logging.py
        python -m py_compile atlas_knowledge_ingest.py
        python -m py_compile _fetch_otp.py
        echo "✅ All key modules compile without syntax errors"
