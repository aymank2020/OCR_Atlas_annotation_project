  - 0.55
  - 0.85
  reference_frame_max_side: 960
  reference_frame_jpeg_quality: 82
  reference_frame_max_total_kb: 420
  extra_instructions: >-
    If floor mat vs table is unclear, do not guess raised furniture; use neutral
    location wording. Apply the newest dense-first segmenting update: shorter
    segments are the standard, target 2-5 seconds when the visible actions support
    it, never exceed 10 seconds, capture task-relevant pauses, and correct the
    existing auto-labels instead of rewriting from zero unless the draft is clearly
    wrong.
