input:
  episode_id: "f01_agentscope"
  candidate_json: "data/f01.json"
  video_duration_sec: 59.0
  video_file: ""
  video_url: ""
  headers_json: ""

providers:
  candidate:
    type: "file"
    model: "gemini-2.5-pro"
    api_key: ""
    max_frames: 45
    skip_object_map: false

  repair:
    # AgentScope wrappers:
    # agentscope_openai | agentscope_anthropic | agentscope_claude | agentscope_gemini
    type: "agentscope_openai"
    model: "gpt-4o"
    # Prefer env var OPENAI_API_KEY
    api_key: ""

  judge:
    # Keep disabled first, then enable after validating repair quality.
    type: "none"
    model: "gpt-4o-mini"
    api_key: ""

stages:
  run_repair: true
  run_judge: false
  repair_policy: "major_only"
  judge_policy: "on_major_or_repair"
  fail_open_on_repair_error: true
  fail_open_on_judge_error: true

output:
  dir: "outputs"
  prefix: "atlas_agentscope"
  save_debug_files: true
